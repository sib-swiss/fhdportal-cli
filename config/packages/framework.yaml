# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    http_client:
        default_options:
            verify_peer: true
            verify_host: true
            crypto_method: !php/const STREAM_CRYPTO_METHOD_TLSv1_2_CLIENT

    # Sessions are disabled: this is a CLI application with no session use.
    session: false

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
